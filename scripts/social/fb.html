<!doctype html><html lang="it"><head><meta charset="utf-8"><link rel="stylesheet" href="stile.css">
<style>
.tela{width:1200px;height:630px}
.fascia{height:46px;padding:0 40px;font-size:16px;letter-spacing:.14em}
.biglietto{grid-template-columns:380px 1fr;position:absolute;left:40px;right:40px;top:76px;height:470px}
.corpo-biglietto{display:flex;flex-direction:column;justify-content:space-between;padding:28px 36px 24px 40px;border-left:5px dashed var(--inchiostro)}
.testa-biglietto{font-size:14px}
.titolo{font-size:76px}
.occhiello{font-size:20px;margin-top:12px}
.dati{font-size:14px;padding-top:10px}
.biglietto .buco{left:362px;width:36px;height:36px}.buco.su{top:-18px}.buco.giu{bottom:-18px}
.piede{position:absolute;left:40px;right:40px;bottom:22px;display:flex;justify-content:space-between;align-items:center}
.piede .logo{font-size:34px}
.credito{font-size:12px;max-width:520px;text-align:right}
</style></head><body><div class="tela">
<div class="fascia"><span>{{fascia}}</span><span class="presenta">lamusicadelsanto.it</span></div>
<div class="biglietto">
 <div class="foto"><img alt="" src="{{foto}}" style="object-position:{{fuoco}}"></div>
 <div class="corpo-biglietto">
  <p class="testa-biglietto"><span>La musica del Santo presenta</span><span>{{sezione}}</span></p>
  <div><h2 class="titolo">{{titolo}}</h2><p class="occhiello">{{occhiello}}</p></div>
  <p class="dati"><span><small>Accadde</small><b>{{giorno_epoca}}</b></span><span><small>Ingresso</small><b>Un ascolto</b></span></p>
 </div>
 <i class="buco su"></i><i class="buco giu"></i>
</div>
<div class="piede"><span class="logo">La musica del Santo</span><span class="credito">{{credito_breve}}</span></div>
</div></body></html>
