<!doctype html><html lang="it"><head><meta charset="utf-8"><link rel="stylesheet" href="stile.css">
<style>
.tela{width:1080px;height:1350px}
.fascia{height:66px;padding:0 56px;font-size:22px;letter-spacing:.14em}
.dentro{padding:0 56px}
.intestazione{display:flex;justify-content:space-between;align-items:flex-end;margin-top:30px}
.logo{font-size:84px}
.motto{font-size:18px;margin-top:8px}
.intestazione .barre{width:170px;height:56px}
.biglietto{grid-template-columns:400px 1fr;height:720px;margin-top:30px}
.corpo-biglietto{display:flex;flex-direction:column;justify-content:space-between;padding:34px 40px 30px 44px;border-left:5px dashed var(--inchiostro)}
.testa-biglietto{font-size:16px}
.titolo{font-size:110px}
.occhiello{font-size:26px;margin-top:20px}
.dati{font-size:17px;padding-top:14px}
.biglietto .buco{left:382px;width:40px;height:40px}.buco.su{top:-20px}.buco.giu{bottom:-20px}
.credito{font-size:14px;margin-top:12px}
.testi{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:26px}
.testo{font-size:24px}
.interno{position:absolute;left:56px;right:56px;bottom:40px;height:62px}
.interno b{padding:0 22px;font-size:18px;letter-spacing:.14em}
.interno span{padding:0 20px;font-size:22px}
</style></head><body><div class="tela">
<div class="fascia"><span>{{fascia}}</span><span class="presenta">lamusicadelsanto.it</span></div>
<div class="dentro">
 <div class="intestazione"><div><h1 class="logo">La musica del Santo</h1><p class="motto">Biglietteria aperta · guida semiseria per autostoppisti musicali</p></div><i class="barre"></i></div>
 <div class="biglietto">
  <div class="foto"><img src="{{foto}}" style="object-position:{{fuoco}}"></div>
  <div class="corpo-biglietto">
   <p class="testa-biglietto"><span>La musica del Santo presenta</span><span>{{sezione}}</span></p>
   <div><h2 class="titolo">{{titolo}}</h2><p class="occhiello">{{occhiello}}</p></div>
   <p class="dati"><span><small>Accadde</small><b>{{giorno_epoca}}</b></span><span><small>Ingresso</small><b>Un ascolto</b></span></p>
  </div>
  <i class="buco su"></i><i class="buco giu"></i>
 </div>
 <p class="credito">{{credito}}</p>
 <div class="testi"><p class="testo">{{testo1}}</p><p class="testo">{{testo2}}</p></div>
</div>
<div class="interno"><b>All’interno</b><span>{{interno}}</span></div>
</div></body></html>
